[build]
  command = "npm run build"
  publish = ".next"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

[[plugins]]
  package = "netlify-plugin-chromium"

# Redirect API calls to Netlify Functions
[[redirects]]
  from = "/api/generate-pdf"
  to = "/.netlify/functions/generate-pdf"
  status = 200

[[redirects]]
  from = "/api/generate-story"
  to = "/.netlify/functions/generate-story"
  status = 200

# Handle Next.js routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200